name: test

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs — a newer push to the same branch/PR makes the in-flight run moot (saves CI).
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep repository artifacts byte-stable on Windows; contracts and generated assets are LF.
      - name: Configure LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Keep the direct full-suite contract while bounding watcher-heavy fixture concurrency.
      - run: node --test --test-concurrency=2
